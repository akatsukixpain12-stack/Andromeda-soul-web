[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "andromeda-soul"
version = "1.0.0"
description = "An intelligence with a soul. Independent AI model framework and architecture."
authors = [{name = "Andromeda Sovereign Intelligence"}]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0.0",
    "pillow>=9.5.0"
]
